name: Security

on:
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_DEFAULT_VERSION: "3.11"

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv sync --dev
    
    - name: Run Safety check
      run: |
        uv run safety check --json --output safety-report.json
      continue-on-error: true
    
    - name: Run pip-audit
      run: |
        uv tool install pip-audit
        uv tool run pip-audit --format=json --output=pip-audit-report.json
      continue-on-error: true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-security-reports
        path: |
          safety-report.json
          pip-audit-report.json

  code-scan:
    name: Code Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv sync --dev
    
    - name: Run Bandit security scan
      run: |
        uv run bandit -r src/ -f json -o bandit-report.json
      continue-on-error: true
    
    - name: Run Semgrep scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/python
        generateSarif: "1"
      continue-on-error: true
    
    - name: Upload code security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: code-security-reports
        path: |
          bandit-report.json
          semgrep.sarif

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Fetch full history for comprehensive scan
    
    - name: Run TruffleHog OSS
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

  license-scan:
    name: License Compliance Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv sync --dev
    
    - name: Generate license report
      run: |
        uv tool install pip-licenses
        uv tool run pip-licenses --format=json --output-file=licenses-report.json
        uv tool run pip-licenses --format=plain --output-file=licenses-report.txt
    
    - name: Check for problematic licenses
      run: |
        # Define list of problematic licenses
        PROBLEMATIC_LICENSES="GPL-3.0,AGPL-3.0,LGPL-3.0"
        
        # Check if any dependencies use problematic licenses
        if grep -E "$PROBLEMATIC_LICENSES" licenses-report.txt; then
          echo "⚠️ Found dependencies with potentially problematic licenses"
          echo "Please review the license compatibility"
          exit 1
        else
          echo "✅ No problematic licenses found"
        fi
    
    - name: Upload license report
      uses: actions/upload-artifact@v4
      with:
        name: license-report
        path: |
          licenses-report.json
          licenses-report.txt

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Build Docker image
      run: |
        # Create a simple Dockerfile for testing
        cat > Dockerfile << EOF
        FROM python:3.11-slim
        
        WORKDIR /app
        
        # Install system dependencies
        RUN apt-get update && apt-get install -y \\
            curl \\
            && rm -rf /var/lib/apt/lists/*
        
        # Copy and install Python dependencies
        COPY pyproject.toml uv.lock ./
        RUN pip install uv && uv sync --frozen
        
        # Copy source code
        COPY src/ ./src/
        
        # Install the package
        RUN uv pip install -e .
        
        CMD ["python", "-c", "import pmas; print(f'PMAS {pmas.__version__} ready')"]
        EOF
        
        docker build -t pmas:security-test .
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'pmas:security-test'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  security-scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read
    
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    
    - name: Run analysis
      uses: ossf/scorecard-action@v2.3.1
      with:
        results_file: results.sarif
        results_format: sarif
        publish_results: true
    
    - name: Upload SARIF results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: results.sarif

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-scan, license-scan]
    if: always()
    
    steps:
    - name: Download all security reports
      uses: actions/download-artifact@v3
      with:
        path: security-reports/
    
    - name: Generate security summary
      run: |
        echo "# Security Scan Summary" > security-summary.md
        echo "" >> security-summary.md
        echo "## Scan Results" >> security-summary.md
        echo "" >> security-summary.md
        
        # Check dependency scan results
        if [ "${{ needs.dependency-scan.result }}" == "success" ]; then
          echo "- ✅ Dependency Security Scan: PASSED" >> security-summary.md
        else
          echo "- ❌ Dependency Security Scan: FAILED" >> security-summary.md
        fi
        
        # Check code scan results
        if [ "${{ needs.code-scan.result }}" == "success" ]; then
          echo "- ✅ Code Security Scan: PASSED" >> security-summary.md
        else
          echo "- ❌ Code Security Scan: FAILED" >> security-summary.md
        fi
        
        # Check license scan results
        if [ "${{ needs.license-scan.result }}" == "success" ]; then
          echo "- ✅ License Compliance Scan: PASSED" >> security-summary.md
        else
          echo "- ❌ License Compliance Scan: FAILED" >> security-summary.md
        fi
        
        echo "" >> security-summary.md
        echo "## Recommendations" >> security-summary.md
        echo "" >> security-summary.md
        echo "- Review all security reports in the artifacts" >> security-summary.md
        echo "- Address any high-severity vulnerabilities immediately" >> security-summary.md
        echo "- Update dependencies with known vulnerabilities" >> security-summary.md
        echo "- Review and approve any new license dependencies" >> security-summary.md
        
        echo "" >> security-summary.md
        echo "Generated on: $(date -u)" >> security-summary.md
        
        cat security-summary.md
    
    - name: Upload security summary
      uses: actions/upload-artifact@v4
      with:
        name: security-summary
        path: security-summary.md
    
    - name: Comment on PR (if applicable)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('security-summary.md', 'utf8');
          
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

  security-notification:
    name: Security Notification
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-scan, secrets-scan, license-scan]
    if: failure() && github.event_name == 'schedule'
    
    steps:
    - name: Create security issue
      uses: actions/github-script@v6
      with:
        script: |
          const title = `🚨 Security Scan Alert - ${new Date().toISOString().split('T')[0]}`;
          const body = `
          # Security Scan Alert
          
          One or more security scans have failed in the scheduled security check.
          
          ## Failed Scans
          - Dependency Scan: ${{ needs.dependency-scan.result }}
          - Code Scan: ${{ needs.code-scan.result }}
          - Secrets Scan: ${{ needs.secrets-scan.result }}
          - License Scan: ${{ needs.license-scan.result }}
          
          ## Action Required
          1. Review the security scan artifacts
          2. Address any critical vulnerabilities
          3. Update dependencies as needed
          4. Close this issue once resolved
          
          ## Workflow Run
          [View workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})
          
          Auto-generated by security workflow.
          `;
          
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: title,
            body: body,
            labels: ['security', 'urgent']
          });
