[tool:pytest]
# Pytest configuration for PMAS test suite
# Minimum pytest version requirement
minversion = 7.0

# Test discovery configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marker definitions with strict enforcement
markers =
    unit: Unit tests for individual components in complete isolation using mocks and fakes. No external dependencies.
    integration: Tests verifying interaction between multiple internal PMAS components using fakes for external systems. No real browsers or network calls.
    real_browser: Minimal smoke tests validating PMAS integration with actual headless browser drivers. Must be explicitly enabled via environment variable.

# Strict marker enforcement - all markers must be registered
addopts = 
    --strict-markers
    --strict-config
    -v
    --tb=short
    --color=yes
    --durations=10
    --disable-warnings

# Output formatting
console_output_style = progress
junit_family = xunit2

# Logging configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test timeout (in seconds)
timeout = 300

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    error::UserWarning
