[mutmut]
# Focus on core modules for mutation testing
paths_to_mutate = src/pmas/core/
# Use our comprehensive test suite
test_command = uv run pytest tests/unit/ tests/integration/ -x --tb=no -q
# Exclude test files and __init__.py files
paths_to_exclude = tests/
# Run tests in parallel for faster execution
runner = python
# Backup directory for mutant files
backup_dir = .mutmut_backup
